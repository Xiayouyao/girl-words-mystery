<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>女孩的话｜文字推理解谜</title>
  <meta name="description" content="从证词中记录线索、建立推论，并找出藏在叙述裂缝里的真凶。">
  <style>:root {
  --ink: #071013;
  --ink-2: #0b191d;
  --glass: rgba(7, 16, 19, 0.91);
  --teal: #66b7b3;
  --teal-dark: #285b5d;
  --paper: #e6dbc3;
  --paper-dim: #a89f8d;
  --amber: #e2a957;
  --amber-light: #ffd68c;
  --rust: #9b4034;
  --line: rgba(129, 187, 183, 0.27);
  --shadow: rgba(0, 0, 0, 0.72);
  --serif: "Noto Serif SC", "Songti SC", SimSun, serif;
  --sans: Inter, "Microsoft YaHei", "PingFang SC", sans-serif;
}

* { box-sizing: border-box; }

html, body { margin: 0; min-height: 100%; background: var(--ink); color: var(--paper); }

body { font-family: var(--sans); }

button, input { font: inherit; }

button { border: 0; cursor: pointer; }

button:focus-visible, input:focus-visible { outline: 2px solid var(--amber-light); outline-offset: 3px; }

button:disabled { cursor: not-allowed; }

.game {
  position: relative;
  min-height: 100svh;
  overflow: hidden;
  isolation: isolate;
  background: var(--ink);
}

.scene-image {
  position: absolute;
  z-index: -4;
  inset: 0;
  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;
  transform: scale(1.015);
}

.scene-courtyard { background-image: url("./art-v3/courtyard.webp"); }
.scene-dining { background-image: url("./art-v3/dining-room.webp"); }
.scene-stairwell { background-image: url("./art-v3/stairwell.webp"); }

.cinema-grain {
  position: absolute;
  z-index: 20;
  inset: 0;
  pointer-events: none;
  opacity: 0.14;
  mix-blend-mode: screen;
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,.045) 0, rgba(255,255,255,.045) 1px, transparent 1px, transparent 4px),
    radial-gradient(circle at 20% 30%, rgba(255,255,255,.04) 0 1px, transparent 1px),
    radial-gradient(circle at 70% 60%, rgba(255,255,255,.03) 0 1px, transparent 1px);
  background-size: auto, 7px 7px, 11px 11px;
}

.eyebrow {
  margin: 0;
  color: var(--teal);
  font-size: 10px;
  letter-spacing: .24em;
  text-transform: uppercase;
}

.action-button {
  min-width: 250px;
  display: inline-flex;
  align-items: stretch;
  justify-content: space-between;
  padding: 0;
  border: 1px solid rgba(255,214,140,.65);
  background: rgba(8,18,20,.91);
  color: var(--paper);
  box-shadow: 7px 7px 0 rgba(0,0,0,.32);
  transition: transform .18s ease, background .18s ease, border-color .18s ease;
}

.action-button:hover { transform: translate(-2px,-2px); border-color: var(--amber-light); background: #12262a; }
.action-button span { padding: 14px 22px; font-family: var(--serif); font-size: 16px; letter-spacing: .12em; }
.action-button i { display: grid; place-items: center; min-width: 78px; padding: 0 12px; border-left: 1px solid rgba(255,214,140,.35); color: var(--amber); font-size: 8px; font-style: normal; letter-spacing: .13em; }

/* Title */

.title-screen::before {
  content: "";
  position: absolute;
  z-index: -2;
  inset: 0;
  background:
    linear-gradient(90deg, rgba(3,10,13,.92) 0%, rgba(3,10,13,.66) 35%, rgba(3,10,13,.12) 69%, rgba(3,10,13,.56) 100%),
    linear-gradient(0deg, rgba(2,7,9,.8) 0%, transparent 45%, rgba(2,7,9,.35) 100%);
}

.title-topline {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 4vw;
  border-bottom: 1px solid rgba(135,191,186,.2);
  background: rgba(3,10,12,.52);
  color: rgba(211,230,224,.76);
  font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .15em;
}

.title-copy {
  position: absolute;
  top: 50%;
  left: clamp(28px, 8vw, 150px);
  width: min(650px, 48vw);
  padding: 28px 34px 30px;
  transform: translateY(-48%);
  clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
  border: 1px solid rgba(102,183,179,.48);
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 2px, transparent 2px 5px),
    linear-gradient(135deg, rgba(5,17,20,.94), rgba(5,13,16,.76));
  box-shadow: -7px 0 0 rgba(151,55,44,.92), 9px 9px 0 rgba(0,0,0,.35);
  backdrop-filter: blur(4px);
}

.title-copy::before {
  content: "";
  position: absolute;
  inset: 8px;
  pointer-events: none;
  border: 1px solid rgba(226,169,87,.13);
  clip-path: inherit;
}

.title-copy::after {
  content: "CASE // 04";
  position: absolute;
  top: 13px;
  right: 18px;
  color: rgba(226,169,87,.58);
  font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
  font-size: 8px;
  letter-spacing: .18em;
}

.title-copy .eyebrow {
  position: relative;
  z-index: 1;
  display: inline-block;
  padding: 5px 8px 4px;
  border-left: 4px solid var(--teal);
  background: rgba(29,91,90,.18);
  font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .16em;
}

.title-copy h1 {
  position: relative;
  z-index: 1;
  margin: 19px 0 15px;
  color: #f1e3c5;
  font-family: var(--sans);
  font-size: clamp(68px, 7.6vw, 126px);
  font-weight: 900;
  line-height: .92;
  letter-spacing: .1em;
  text-shadow: 4px 0 0 #7e3029, 0 4px 0 #7e3029, 7px 7px 0 rgba(0,0,0,.5);
}

.title-subtitle {
  position: relative;
  z-index: 1;
  max-width: 500px;
  margin: 0 0 27px;
  padding: 10px 0 10px 15px;
  border-left: 2px solid rgba(226,169,87,.58);
  color: #c9c1b0;
  font-family: var(--sans);
  font-size: clamp(14px, 1.18vw, 18px);
  font-weight: 600;
  line-height: 1.75;
  letter-spacing: .05em;
}

.title-copy .action-button {
  position: relative;
  z-index: 1;
  width: 160px;
  min-width: 160px;
  display: grid;
  grid-template-columns: 1fr;
  place-items: center;
  border: 1px solid rgba(255,214,140,.8);
  background: #0b2024;
  box-shadow: 5px 5px 0 rgba(126,48,41,.75);
}

.title-copy .action-button span {
  width: 100%;
  padding: 13px 0;
  font-family: var(--sans);
  font-size: 18px;
  font-weight: 900;
  letter-spacing: .26em;
  text-align: center;
  text-indent: .26em;
}

.title-meta { position: relative; z-index: 1; display: flex; gap: 24px; margin-top: 19px; color: #7c9c9c; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 10px; letter-spacing: .1em; }

.title-case-note {
  position: absolute;
  right: 4vw;
  bottom: 7vh;
  width: min(390px, 31vw);
  padding: 21px 23px 22px;
  border: 1px solid rgba(102,183,179,.23);
  border-left: 4px solid var(--rust);
  background: rgba(5,14,17,.88);
  box-shadow: 7px 7px 0 rgba(0,0,0,.28);
  backdrop-filter: blur(8px);
}

.title-case-note b { display: block; color: var(--amber); font-size: 14px; letter-spacing: .12em; }
.title-case-note p { margin: 10px 0 0; color: #aab8b3; font-family: var(--sans); font-size: 12px; line-height: 1.8; }

/* HUD */

.game-hud {
  position: absolute;
  z-index: 15;
  top: 0;
  left: 0;
  right: 0;
  height: 64px;
  display: grid;
  grid-template-columns: 230px 1fr 150px;
  align-items: stretch;
  border-bottom: 1px solid var(--line);
  background: rgba(4,13,16,.89);
  backdrop-filter: blur(13px);
  box-shadow: 0 12px 30px rgba(0,0,0,.18);
}

.hud-case { display: flex; flex-direction: column; justify-content: center; padding: 0 24px; border-right: 1px solid var(--line); }
.hud-case b { font-family: var(--serif); font-size: 18px; font-weight: 500; letter-spacing: .12em; }
.hud-case span { margin-top: 4px; color: #577477; font-size: 7px; letter-spacing: .14em; }

.game-hud nav { display: flex; align-items: stretch; justify-content: center; }
.game-hud nav > span { position: relative; min-width: 132px; display: flex; align-items: center; justify-content: center; gap: 9px; color: #50696b; font-size: 11px; font-weight: 650; letter-spacing: .1em; }
.game-hud nav > span::after { content: ""; position: absolute; left: 18px; right: 18px; bottom: 0; height: 3px; background: transparent; }
.game-hud nav i { font-family: Georgia, serif; font-size: 10px; font-style: normal; }
.game-hud nav .done { color: #779290; }
.game-hud nav .active { color: var(--paper); }
.game-hud nav .active::after { background: var(--rust); box-shadow: 0 0 13px rgba(155,64,52,.7); }

.hud-count { display: flex; flex-direction: column; justify-content: center; padding: 0 20px; border-left: 1px solid var(--line); color: #91a8a5; font-size: 10px; line-height: 1.75; }
.hud-count b { color: var(--amber); font-weight: 500; }

/* Story */

.story-screen::before {
  content: "";
  position: absolute;
  z-index: -2;
  inset: 0;
  background:
    radial-gradient(circle at 18% 53%, rgba(226,169,87,.12), transparent 28%),
    linear-gradient(90deg, rgba(3,9,11,.78) 0 27%, rgba(3,9,11,.2) 55%, rgba(3,9,11,.52) 100%),
    linear-gradient(0deg, rgba(2,7,9,.98) 0 18%, transparent 62%);
}

.story-dining::before { background: linear-gradient(90deg, rgba(3,8,10,.68) 0 30%, rgba(3,8,10,.1) 60%, rgba(3,8,10,.45)), linear-gradient(0deg, rgba(2,7,9,.98) 0 30%, transparent 72%); }
.story-stairwell::before { background: linear-gradient(90deg, rgba(2,8,10,.72) 0 28%, rgba(2,8,10,.22) 58%, rgba(2,8,10,.52)), linear-gradient(0deg, rgba(1,6,8,.98) 0 32%, transparent 75%); }

.story-progress {
  position: absolute;
  z-index: 5;
  top: 89px;
  right: 3vw;
  display: flex;
  align-items: center;
  gap: 4px;
}

.story-progress button { display: flex; align-items: center; gap: 7px; padding: 7px 5px; background: transparent; color: #577173; }
.story-progress span { font-family: Georgia, serif; font-size: 8px; }
.story-progress i { width: 22px; height: 1px; background: #426164; transition: width .2s ease, background .2s ease; }
.story-progress button.active { color: var(--amber-light); }
.story-progress button.active i { width: 43px; background: var(--amber); }

.portrait {
  position: absolute;
  z-index: 1;
  left: 3.2vw;
  bottom: 0;
  width: clamp(220px, 22vw, 390px);
  height: min(78vh, 800px);
  margin: 0;
  overflow: visible;
  border: 0;
  background: transparent;
  box-shadow: none;
}

.portrait::before { content: ""; position: absolute; z-index: 2; inset: 0; pointer-events: none; background: linear-gradient(0deg, rgba(3,9,11,.92) 0, transparent 35%), linear-gradient(90deg, rgba(3,9,11,.35), transparent 45%, rgba(3,9,11,.2)); }
.portrait img { width: 100%; height: 100%; display: block; object-fit: cover; object-position: center top; filter: saturate(.86) contrast(1.04); -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 6%, #000 88%, transparent 100%); mask-image: linear-gradient(to bottom, transparent 0, #000 6%, #000 88%, transparent 100%); }
.portrait figcaption { position: absolute; z-index: 3; left: 18px; right: 18px; bottom: 18px; display: flex; align-items: end; justify-content: space-between; border-top: 1px solid rgba(222,206,173,.35); padding-top: 10px; }
.portrait figcaption span { font-family: var(--serif); font-size: 23px; letter-spacing: .12em; }
.portrait figcaption small { color: #668082; font-size: 7px; letter-spacing: .14em; }

.portrait-compact { position: relative; left: auto; bottom: auto; width: 76px; height: 94px; flex: 0 0 76px; border: 1px solid rgba(226,169,87,.35); box-shadow: none; }
.portrait-compact::before { background: linear-gradient(0deg, rgba(5,13,15,.55), transparent 45%); }

.dialogue-shell {
  position: absolute;
  z-index: 6;
  left: clamp(300px, 28vw, 520px);
  right: 3vw;
  bottom: 3vh;
  min-height: 455px;
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  border: 1px solid rgba(116,177,173,.35);
  background: rgba(4,12,15,.91);
  box-shadow: 14px 15px 0 rgba(0,0,0,.27), inset 0 0 0 1px rgba(255,255,255,.025);
  backdrop-filter: blur(16px);
}

.speaker-ribbon { min-height: 62px; display: grid; grid-template-columns: auto auto 1fr; align-items: center; gap: 15px; padding: 0 24px; border-bottom: 1px solid var(--line); background: rgba(13,34,38,.65); }
.speaker-ribbon > span { color: var(--amber-light); font-family: var(--serif); font-size: 23px; letter-spacing: .12em; }
.speaker-ribbon small { padding: 5px 8px; border: 1px solid rgba(226,169,87,.28); color: var(--amber); font-size: 8px; letter-spacing: .14em; }
.speaker-ribbon > i { justify-self: end; color: #637f7f; font-size: 8px; font-style: normal; letter-spacing: .11em; }

.source-warning { margin: 0; padding: 12px 24px; border-bottom: 1px solid rgba(104,167,163,.17); color: #9bacaa; font-size: 12px; line-height: 1.65; }
.source-warning::before { content: "SOURCE / "; color: var(--rust); font-size: 9px; letter-spacing: .14em; }

.dialogue-copy { align-self: center; padding: clamp(20px, 3vh, 36px) clamp(24px, 3vw, 46px); }
.dialogue-paragraph { margin: 0 0 14px; }
.dialogue-paragraph:last-child { margin-bottom: 0; }
.dialogue-paragraph p { margin: 0; color: #e7ddca; font-family: var(--serif); font-size: clamp(17px, 1.55vw, 24px); line-height: 2; }
.dialogue-paragraph button { display: inline; margin: 0 2px; padding: 1px 5px 2px; border-bottom: 1px dashed rgba(226,169,87,.78); background: rgba(226,169,87,.08); color: var(--amber-light); font-family: inherit; font-size: inherit; line-height: inherit; text-align: left; transition: background .15s ease, color .15s ease, box-shadow .15s ease; }
.dialogue-paragraph button i { display: inline-grid; place-items: center; width: 15px; height: 15px; margin-left: 3px; border: 1px solid rgba(226,169,87,.45); font-family: var(--sans); font-size: 9px; font-style: normal; line-height: 1; vertical-align: 2px; }
.dialogue-paragraph button:hover { background: rgba(226,169,87,.18); }
.dialogue-paragraph button.selected { border-bottom-style: solid; background: var(--amber); color: #17140f; box-shadow: 0 0 18px rgba(226,169,87,.2); }
.dialogue-paragraph button.selected i { border-color: rgba(23,20,15,.45); }

.dialogue-paragraph.quotation { display: flex; gap: 16px; align-items: center; padding: 12px 15px; border-left: 3px solid var(--rust); background: linear-gradient(90deg, rgba(155,64,52,.16), rgba(155,64,52,.035)); }
.quote-label { display: block; margin-bottom: 5px; color: #b76c5c; font-size: 8px; letter-spacing: .18em; }
.dialogue-paragraph.quotation p { font-size: clamp(18px, 1.75vw, 27px); }
.dialogue-paragraph.discovery { padding: 12px 16px; border: 1px solid rgba(155,64,52,.38); background: rgba(74,17,18,.19); }

.dialogue-footer { min-height: 84px; display: grid; grid-template-columns: 1fr auto; border-top: 1px solid var(--line); }
.record-feedback { display: grid; grid-template-columns: 90px 1fr auto; align-items: center; gap: 10px; padding: 12px 18px; }
.record-feedback > span { color: var(--amber); font-size: 10px; font-weight: 700; letter-spacing: .12em; }
.record-feedback p { margin: 0; color: #95a7a4; font-size: 11px; line-height: 1.6; }
.record-feedback small { color: #698486; font-size: 9px; }

.story-controls { display: flex; min-width: 280px; border-left: 1px solid var(--line); }
.story-controls button { min-width: 108px; padding: 0 18px; background: transparent; color: #89a09f; font-size: 12px; font-weight: 650; }
.story-controls button:disabled { opacity: .25; }
.story-controls .next { flex: 1; display: flex; align-items: center; justify-content: center; gap: 15px; border-left: 1px solid var(--line); background: rgba(36,86,87,.34); color: var(--paper); }
.story-controls .next:hover { background: rgba(62,117,115,.42); }
.story-controls .next span { color: var(--amber); font-size: 21px; }

/* Deduction board */

.board-screen { min-height: 100svh; overflow-y: auto; padding: 64px 0 0; }
.board-screen .scene-image { position: fixed; filter: blur(3px) saturate(.55) brightness(.46); transform: scale(1.04); }
.board-overlay { position: fixed; z-index: -2; inset: 0; background: linear-gradient(90deg, rgba(3,11,13,.7), rgba(3,11,13,.93) 64%), repeating-linear-gradient(0deg, transparent 0 49px, rgba(94,151,148,.05) 50px); }

.board-title { position: relative; z-index: 2; display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 6px 20px; padding: 28px 4vw 18px; }
.board-title h2 { margin: 0; color: var(--paper); font-family: var(--serif); font-size: clamp(34px, 4vw, 60px); font-weight: 500; letter-spacing: .05em; }
.board-title .eyebrow { grid-column: 1; }
.board-title > button { grid-column: 2; grid-row: 1 / 3; align-self: center; padding: 12px 16px; border: 1px solid var(--line); background: rgba(6,17,20,.7); color: #9fb5b2; font-size: 12px; font-weight: 650; }

.board-workspace { position: relative; z-index: 2; display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(390px, .75fr); gap: 18px; padding: 0 3vw 4vw; }

.note-wall { align-content: start; display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 13px; padding: 24px; border: 1px solid rgba(116,177,173,.26); background: rgba(4,14,17,.54); box-shadow: inset 0 0 60px rgba(0,0,0,.22); }
.note-card { position: relative; min-height: 180px; display: grid; grid-template-rows: auto auto auto 1fr; gap: 8px; padding: 18px 17px; border: 1px solid rgba(200,188,155,.25); background: linear-gradient(145deg, #d8ccb1, #b9aa8e); color: #171a18; font-family: var(--sans); text-align: left; transform: rotate(var(--tilt)); box-shadow: 7px 8px 0 rgba(0,0,0,.2); transition: transform .15s ease, box-shadow .15s ease, background .15s ease; }
.note-card::before { content: ""; position: absolute; top: -5px; left: calc(50% - 18px); width: 36px; height: 10px; background: rgba(114,36,31,.6); box-shadow: 0 1px 0 rgba(255,255,255,.13); }
.note-card:hover { transform: translateY(-3px) rotate(0); box-shadow: 9px 11px 0 rgba(0,0,0,.25); }
.note-card.selected { background: linear-gradient(145deg, #f0c97f, #c9944e); box-shadow: 0 0 0 3px var(--rust), 9px 11px 0 rgba(0,0,0,.25); transform: translateY(-3px) rotate(0); }
.note-card > span { color: #843c31; font-family: inherit; font-size: 9px; }
.note-card b { font-family: inherit; font-size: 15px; font-weight: 750; line-height: 1.45; }
.note-card small { color: #735e4c; font-family: inherit; font-size: 8px; }
.note-card p { align-self: end; margin: 4px 0 0; padding-top: 9px; border-top: 1px solid rgba(56,45,35,.17); color: #39382f; font-family: inherit; font-size: 9px; line-height: 1.6; }
.empty-board { grid-column: 1 / -1; padding: 80px 20px; color: #577174; text-align: center; }

.deduction-console { position: sticky; top: 82px; height: calc(100svh - 105px); display: grid; grid-template-rows: auto auto auto 1fr auto; border: 1px solid rgba(116,177,173,.3); background: rgba(4,13,16,.93); backdrop-filter: blur(15px); box-shadow: 14px 16px 0 rgba(0,0,0,.25); }
.pair-slots { display: grid; grid-template-columns: 1fr 22px 1fr; align-items: center; gap: 8px; padding: 22px 20px 12px; }
.pair-slots > div { min-height: 90px; display: grid; place-items: center; padding: 11px; border: 1px dashed #3d6465; background: #08171a; color: #6e8d8e; font-family: var(--serif); font-size: 15px; line-height: 1.5; text-align: center; }
.pair-slots > div.filled { border-style: solid; border-color: var(--amber); background: rgba(226,169,87,.1); color: var(--paper); }
.pair-slots > span { color: var(--rust); font-size: 18px; text-align: center; }
.verify-button { margin: 0 20px; min-height: 48px; border: 1px solid rgba(226,169,87,.5); background: #213e3e; color: var(--paper); font-size: 13px; font-weight: 700; letter-spacing: .1em; }
.verify-button:disabled { border-color: #294447; background: #0d2225; color: #405d5f; }
.pair-message { min-height: 54px; margin: 8px 20px 0; padding: 12px 14px; border-left: 3px solid rgba(226,169,87,.76); background: rgba(226,169,87,.075); color: #d0b989; font-size: 11px; line-height: 1.65; }

.deduction-log { min-height: 0; overflow-y: auto; padding: 0 20px 18px; }
.deduction-log header { position: sticky; z-index: 2; top: 0; display: flex; justify-content: space-between; padding: 15px 0 12px; background: #071418; color: #9aafad; font-size: 11px; font-weight: 700; }
.deduction-log header b { color: var(--amber); }
.deduction-log article { position: relative; margin-bottom: 11px; padding: 16px 17px; border-left: 4px solid var(--rust); background: #102326; }
.deduction-log article.bonus { border-left-color: var(--teal-dark); }
.deduction-log article > span { position: absolute; top: 14px; right: 14px; color: #a77856; font-size: 9px; letter-spacing: .12em; }
.deduction-log h3 { margin: 0 52px 8px 0; color: #e6d7ba; font-family: var(--serif); font-size: 17px; }
.deduction-log p { margin: 0; color: #9dafab; font-size: 10px; line-height: 1.7; }
.no-deduction { padding: 45px 5px; color: #456265; font-size: 9px; text-align: center; }
.accuse-button { min-height: 58px; border-top: 1px solid rgba(226,169,87,.38); background: var(--rust); color: #f5e4c3; font-family: var(--serif); font-size: 13px; letter-spacing: .09em; }
.accuse-button:disabled { border-color: #29474a; background: #0d2225; color: #486568; }

/* Accusation */

.accuse-screen::before { content: ""; position: absolute; z-index: -2; inset: 0; background: linear-gradient(90deg, rgba(2,7,9,.97) 0 58%, rgba(2,7,9,.58) 72%, rgba(2,7,9,.83)); }
.accuse-shadow { position: absolute; z-index: -1; inset: 0; background: radial-gradient(circle at 75% 42%, rgba(155,64,52,.18), transparent 28%); }

.suspect-file { position: absolute; top: 64px; bottom: 0; left: 0; width: 61%; padding: clamp(26px, 3.2vw, 48px); overflow-y: auto; }
.suspect-file h2 { margin: 10px 0 20px; font-family: var(--serif); font-size: clamp(28px, 2.7vw, 42px); font-weight: 500; line-height: 1.22; white-space: nowrap; }
.suspect-strip { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
.suspect-strip button { min-height: 265px; display: grid; grid-template-rows: 188px auto 1fr; overflow: hidden; border: 1px solid rgba(116,177,173,.28); background: rgba(7,21,24,.86); color: var(--paper); text-align: left; }
.suspect-strip button:hover { border-color: var(--amber); transform: translateY(-2px); }
.suspect-strip img { width: 100%; height: 188px; object-fit: contain; object-position: center; background: #061316; filter: saturate(.72) contrast(1.03); }
.unknown-face { display: grid; place-items: center; height: 188px; background: linear-gradient(145deg,#132c30,#071518); color: #3e5f61; font-family: Georgia, serif; font-size: 64px; }
.suspect-strip b { padding: 12px 13px 4px; font-family: var(--serif); font-size: 17px; font-weight: 500; }
.suspect-strip small { padding: 0 13px 15px; color: #7f9a99; font-size: 10px; line-height: 1.55; }
.suspect-player { animation: suspect-player-in .9s steps(9,end) both; }
.suspect-strip img.player-portrait { filter: saturate(.62) contrast(1.12) brightness(.9); }
@keyframes suspect-player-in { from { opacity: 0; transform: translateY(18px); filter: blur(7px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }

.accusation-box { position: absolute; top: 50%; right: 3vw; width: min(500px, 34vw); padding: 42px; transform: translateY(-45%); border: 1px solid rgba(180,93,70,.53); background: rgba(17,12,13,.93); box-shadow: 12px 14px 0 rgba(0,0,0,.35); backdrop-filter: blur(15px); }
.accusation-box > span { color: #c98d72; font-size: 11px; font-weight: 700; letter-spacing: .13em; }
.accusation-box label { display: block; margin: 26px 0 10px; color: #e0d1b7; font-family: var(--serif); font-size: 22px; }
.accusation-box input { width: 100%; height: 68px; padding: 0 18px; border: 1px solid #795048; border-radius: 0; background: #071114; color: #f1dfbd; font-family: var(--serif); font-size: 25px; }
.accusation-box > p { min-height: 72px; margin: 16px 0; color: #b5a594; font-size: 12px; line-height: 1.75; }
.accusation-box .action-button { width: 100%; }
.narrative-hint { margin: 0 0 16px; padding: 13px; border-left: 3px solid var(--amber); background: rgba(226,169,87,.08); }
.narrative-hint b { display: block; color: var(--amber); font-size: 9px; }
.narrative-hint span { display: block; margin-top: 6px; color: #a99d89; font-size: 9px; line-height: 1.6; }
.back-to-board { display: block; margin: 19px auto 0; border-bottom: 1px solid #6c8888; background: transparent; color: #91aaa8; font-size: 11px; }

/* Reveal */

.reveal-blackout { position: absolute; z-index: -2; inset: 0; background: linear-gradient(90deg, rgba(1,5,7,.64) 0 31%, rgba(1,5,7,.94) 51% 100%); }
.reveal-screen > .portrait { left: 6vw; width: min(29vw,420px); filter: grayscale(.25) contrast(1.05); }
.reveal-screen > .portrait-evil { filter: saturate(.78) contrast(1.18) drop-shadow(0 0 28px rgba(139,43,36,.28)); }
.portrait-evil img { animation: culprit-face-in .8s steps(6,end) both; }
.portrait-evil figcaption span { color: #e7b16d; text-shadow: 0 0 13px rgba(172,48,36,.75); }
.reveal-panel { position: absolute; top: 50%; right: 7vw; width: min(760px, 49vw); transform: translateY(-43%); }
.reveal-counter { position: absolute; top: 0; right: 0; color: #577171; font-family: Georgia, serif; font-size: 10px; }
.reveal-panel h2 { margin: 13px 0 20px; color: var(--paper); font-family: var(--serif); font-size: clamp(36px, 4vw, 65px); font-weight: 500; }
.reveal-panel blockquote { margin: 0 0 18px; padding: 20px 0 20px 24px; border-left: 4px solid var(--rust); color: #efdcb7; font-family: var(--serif); font-size: clamp(21px, 2.5vw, 39px); line-height: 1.5; }
.reveal-panel > p:not(.eyebrow) { max-width: 680px; margin: 0 0 24px; color: #9c9b8e; font-size: 12px; line-height: 1.9; }
.final-line { margin: 0 0 24px; padding: 17px 20px; border: 1px solid rgba(226,169,87,.45); background: rgba(91,29,27,.22); }
.final-line small { display: block; margin-bottom: 8px; color: var(--rust); font-size: 8px; letter-spacing: .16em; }
.final-line strong { display: block; color: var(--amber-light); font-family: var(--serif); font-size: clamp(19px,2vw,30px); font-weight: 500; }

.reveal-screen-final .reveal-blackout {
  background:
    radial-gradient(circle at 50% 62%, rgba(91,24,24,.16), transparent 26%),
    linear-gradient(0deg, rgba(1,4,6,.98), rgba(1,5,7,.88));
  animation: final-darken 7s ease-out both;
}
.reveal-screen-final .scene-image { filter: saturate(.35) brightness(.32) blur(2px); transform: scale(1.025); }
.reveal-screen-final .cinema-grain { opacity: .58; }
.final-confession { position: absolute; z-index: 4; inset: 64px 0 0; overflow: hidden; }
.final-confession::before { content: ""; position: absolute; z-index: 5; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center 68%, transparent 0 20%, rgba(0,0,0,.32) 54%, rgba(0,0,0,.86) 100%); }
.final-confession-line { position: absolute; z-index: 8; top: 9vh; left: 50%; width: min(900px, 88vw); margin: 0; transform: translateX(-50%); color: #ead9b7; font-family: var(--serif); font-size: clamp(26px, 3.2vw, 50px); line-height: 1.55; text-align: center; text-shadow: 0 0 18px rgba(187,66,48,.32), 3px 3px 0 rgba(0,0,0,.55); }
.final-confession-line span { display: inline-block; opacity: 0; filter: blur(7px); animation: final-words-in 1.7s ease-out forwards; }
.final-confession-line span:nth-child(2) { animation-delay: 2s; }
.final-confession .portrait { z-index: 4; left: 50%; bottom: -3vh; width: min(430px, 34vw); height: calc(100svh - 205px); opacity: 0; transform: translateX(-50%) scale(1.04); animation: final-portrait-in 2.4s 4s steps(18,end) forwards; filter: saturate(.7) contrast(1.2) drop-shadow(0 0 36px rgba(122,32,27,.3)); }
.final-confession .portrait::before { background: linear-gradient(0deg, rgba(2,6,8,.97) 0, transparent 38%), linear-gradient(90deg, rgba(2,6,8,.58), transparent 44%, rgba(2,6,8,.55)); }
.final-confession .portrait img { animation: none; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 8%, #000 86%, transparent 100%); mask-image: linear-gradient(to bottom, transparent 0, #000 8%, #000 86%, transparent 100%); }
.final-confession .portrait figcaption { display: none; }
.final-confession-control { position: absolute; z-index: 9; right: 6vw; bottom: 5vh; opacity: 0; transform: translateY(10px); pointer-events: none; animation: final-control-in .9s 6.5s ease-out forwards; }

@keyframes culprit-face-in {
  0% { opacity: 0; transform: scale(1.035); filter: brightness(.12) contrast(1.6); }
  36% { opacity: .55; transform: scale(1.018); filter: brightness(.58) contrast(1.35); }
  100% { opacity: 1; transform: scale(1); filter: brightness(.9) contrast(1.08); }
}
@keyframes final-darken { from { opacity: .65; } to { opacity: 1; } }
@keyframes final-words-in { to { opacity: 1; filter: blur(0); } }
@keyframes final-portrait-in { to { opacity: 1; transform: translateX(-50%) scale(1); } }
@keyframes final-control-in { to { opacity: 1; transform: translateY(0); pointer-events: auto; } }

/* Ending */

.ending-shade { position: absolute; z-index: -2; inset: 0; background: linear-gradient(90deg, rgba(2,8,10,.88), rgba(2,8,10,.46)), linear-gradient(0deg, rgba(2,8,10,.8), transparent); backdrop-filter: blur(2px); }
.ending-file { position: absolute; top: 50%; left: 50%; width: min(1120px, 91vw); min-height: 600px; display: grid; grid-template-columns: 290px 1fr; transform: translate(-50%,-48%); border: 1px solid rgba(121,181,177,.37); background: rgba(4,14,17,.91); box-shadow: 18px 20px 0 rgba(0,0,0,.28); backdrop-filter: blur(14px); }
.ending-grade { position: relative; isolation: isolate; overflow: hidden; display: grid; place-items: center; align-content: center; border-right: 1px solid var(--line); background: #061114; }
.ending-grade::before { content: ""; position: absolute; z-index: -2; inset: 0; background-position: center; background-size: cover; filter: saturate(.72) contrast(1.04) brightness(1.28); opacity: .78; }
.ending-grade::after { content: ""; position: absolute; z-index: -1; inset: 0; background: linear-gradient(0deg, rgba(3,10,12,.68) 0 8%, rgba(3,10,12,.08) 48%, rgba(3,10,12,.42)), linear-gradient(90deg, rgba(3,10,12,.24), transparent 55%, rgba(3,10,12,.3)); }
.ending-grade-s::before { background-image: url("./art-v3/grade-s-detective.webp"); }
.ending-grade-a::before { background-image: url("./art-v3/grade-a-detective.webp"); }
.ending-grade-b::before { background-image: url("./art-v3/grade-b-detective.webp"); }
.ending-grade span { position: relative; color: var(--amber-light); font-family: Georgia, serif; font-size: 126px; line-height: .85; text-shadow: 7px 8px 0 rgba(111,42,33,.75), 0 0 28px rgba(0,0,0,.95); }
.ending-grade small { position: relative; margin-top: 18px; color: #9fb4af; font-size: 9px; font-weight: 750; letter-spacing: .22em; text-shadow: 0 2px 8px #000; }
.ending-grade p { position: relative; width: min(225px, calc(100% - 48px)); margin: 19px 24px 0; color: #ead9b8; font-family: var(--serif); font-size: 13px; line-height: 1.75; text-align: left; text-shadow: 0 2px 10px #000; }
.ending-copy { align-self: center; padding: 50px 60px; }
.ending-copy .eyebrow { font-size: 10px; }
.ending-copy h1 { margin: 15px 0 23px; font-family: var(--serif); font-size: clamp(30px,3.2vw,46px); font-weight: 500; line-height: 1.42; }
.ending-copy > p:not(.eyebrow) { max-width: 700px; color: #abb0a4; font-size: 13px; line-height: 2; }
.ending-stats { display: grid; grid-template-columns: repeat(3,1fr); margin: 28px 0; border: 1px solid var(--line); }
.ending-stats > span { display: grid; place-items: center; padding: 16px; }
.ending-stats > span + span { border-left: 1px solid var(--line); }
.ending-stats b { color: var(--amber-light); font-family: Georgia,serif; font-size: 34px; font-weight: 400; }
.ending-stats small { color: #829a98; font-size: 10px; }
.ending-credit { position: absolute; right: 18px; bottom: 12px; margin: 0; color: #516c6c; font-size: 7px; letter-spacing: .1em; }

@media (max-width: 1100px) {
  .game-hud { grid-template-columns: 180px 1fr 125px; }
  .game-hud nav > span { min-width: 96px; }
  .dialogue-shell { left: 31vw; }
  .portrait { width: 26vw; }
  .board-workspace { grid-template-columns: 1fr 370px; }
  .note-wall { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .suspect-file { width: 58%; padding-inline: 35px; }
  .suspect-strip { grid-template-columns: repeat(2,1fr); }
  .accusation-box { width: 36vw; right: 3vw; }
}

@media (max-width: 780px) {
  .game { min-height: 100svh; overflow-y: auto; }
  .title-screen { min-height: 100svh; }
  .title-screen::before { background: linear-gradient(0deg, rgba(2,8,10,.95) 0 38%, rgba(2,8,10,.35) 75%, rgba(2,8,10,.55)); }
  .title-topline { padding: 0 18px; }
  .title-topline span:last-child { display: none; }
  .title-copy { top: auto; left: 22px; right: 22px; bottom: 13vh; width: auto; padding: 23px 21px 24px; transform: none; }
  .title-copy::after { display: none; }
  .title-copy .eyebrow { font-size: 8px; }
  .title-copy h1 { margin-block: 16px 12px; font-size: clamp(54px,16vw,78px); }
  .title-subtitle { margin-bottom: 20px; font-size: 14px; }
  .title-copy .action-button span { font-size: 16px; }
  .title-case-note { display: none; }
  .title-meta { flex-direction: column; gap: 6px; }

  .game-hud { position: fixed; grid-template-columns: 105px 1fr 62px; height: 58px; }
  .hud-case { padding: 0 12px; }
  .hud-case b { font-size: 14px; }
  .hud-case span { display: none; }
  .game-hud nav > span { min-width: 42px; font-size: 0; }
  .game-hud nav i { font-size: 9px; }
  .hud-count { padding: 0 8px; font-size: 8px; }
  .hud-count span { display: none; }

  .story-screen { padding-top: 58px; min-height: 100svh; }
  .story-progress { position: relative; top: auto; right: auto; justify-content: center; padding: 16px 10px 5px; background: rgba(4,13,16,.72); }
  .story-progress i { width: 12px; }
  .story-progress button.active i { width: 22px; }
  .story-screen > .portrait { position: relative; left: auto; bottom: auto; width: min(58vw,280px); height: 34vh; margin: 0 auto; border: 0; }
  .story-screen > .portrait figcaption { bottom: 9px; }
  .dialogue-shell { position: relative; left: auto; right: auto; bottom: auto; width: calc(100% - 22px); min-height: 0; margin: -12px auto 24px; }
  .speaker-ribbon { grid-template-columns: auto auto; padding: 0 15px; }
  .speaker-ribbon > i { grid-column: 1 / -1; justify-self: start; padding-bottom: 8px; }
  .source-warning { padding-inline: 15px; }
  .dialogue-copy { padding: 20px 17px; }
  .dialogue-paragraph p { font-size: 17px; line-height: 2.05; }
  .dialogue-paragraph.quotation { align-items: flex-start; }
  .portrait-compact { width: 58px; height: 76px; flex-basis: 58px; }
  .dialogue-footer { grid-template-columns: 1fr; }
  .record-feedback { grid-template-columns: 78px 1fr; }
  .record-feedback small { display: none; }
  .story-controls { min-width: 0; min-height: 60px; border-top: 1px solid var(--line); border-left: 0; }

  .board-screen { padding-top: 58px; }
  .board-title { display: block; padding: 26px 16px 16px; }
  .board-title h2 { margin: 5px 0 15px; font-size: 36px; }
  .board-workspace { display: block; padding: 0 11px 30px; }
  .note-wall { grid-template-columns: 1fr 1fr; padding: 12px; }
  .note-card { min-height: 160px; padding: 14px 12px; }
  .note-card b { font-size: 13px; }
  .deduction-console { position: relative; top: auto; height: auto; margin-top: 14px; }
  .deduction-log { max-height: 440px; }

  .accuse-screen { padding-top: 58px; }
  .accuse-screen::before { background: rgba(2,7,9,.83); }
  .suspect-file { position: relative; top: auto; bottom: auto; width: auto; padding: 34px 16px 18px; }
  .suspect-strip { grid-template-columns: repeat(2,1fr); }
  .suspect-file h2 { font-size: 34px; white-space: normal; }
  .accusation-box { position: relative; top: auto; right: auto; width: calc(100% - 24px); margin: 0 auto 35px; transform: none; padding: 25px 20px; }

  .reveal-screen { padding-top: 58px; }
  .reveal-blackout { background: linear-gradient(0deg, rgba(1,5,7,.98) 0 62%, rgba(1,5,7,.42)); }
  .reveal-screen > .portrait { position: relative; left: auto; bottom: auto; width: min(56vw,280px); height: 36vh; margin: 18px auto 0; }
  .reveal-panel { position: relative; top: auto; right: auto; width: calc(100% - 28px); margin: -8px auto 35px; padding: 25px 18px; transform: none; background: rgba(3,11,13,.9); }
  .reveal-panel h2 { font-size: 38px; }
  .final-confession { inset: 58px 0 0; }
  .final-confession-line { top: 7vh; width: calc(100% - 30px); font-size: clamp(22px, 7vw, 34px); }
  .final-confession-line span { display: block; }
  .final-confession .portrait { position: absolute; left: 50%; bottom: 7vh; width: min(76vw,360px); height: 62vh; margin: 0; }
  .final-confession-control { right: 16px; bottom: 18px; width: calc(100% - 32px); }

  .ending-screen { min-height: 100svh; padding: 75px 12px 28px; }
  .ending-file { position: relative; top: auto; left: auto; width: 100%; min-height: 0; display: block; transform: none; }
  .ending-grade { min-height: 300px; padding: 28px; border-right: 0; border-bottom: 1px solid var(--line); }
  .ending-grade span { font-size: 92px; }
  .ending-copy { padding: 32px 22px 55px; }
  .ending-copy h1 { font-size: 30px; }
  .ending-copy > p:not(.eyebrow) { font-size: 12px; }
}

@media (max-width: 460px) {
  .action-button { min-width: 0; width: 100%; }
  .title-copy { bottom: 8vh; }
  .title-copy h1 { font-size: 52px; }
  .note-wall, .suspect-strip { grid-template-columns: 1fr; }
  .note-card { min-height: 145px; }
  .speaker-ribbon small { font-size: 7px; }
  .dialogue-paragraph.quotation { display: block; }
  .dialogue-paragraph.quotation .portrait-compact { float: left; margin: 0 12px 7px 0; }
  .pair-slots { grid-template-columns: 1fr; }
  .pair-slots > span { transform: rotate(45deg); }
  .ending-stats { grid-template-columns: 1fr 1fr 1fr; }
  .ending-stats > span { padding: 12px 4px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
  .final-confession-line span, .final-confession .portrait, .final-confession-control { animation-delay: 0s !important; opacity: 1 !important; filter: none !important; pointer-events: auto !important; }
}
</style>

  <div id="game-root"></div>
